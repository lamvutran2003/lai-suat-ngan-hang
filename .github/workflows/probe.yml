name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -m 25 -L -A "$UA" https://lpbank.com.vn/ca-nhan/lai-suat -o lpb.html
          python3 - <<'PY'
          import re
          t=open('lpb.html',encoding='utf-8',errors='replace').read()
          print("LPB tables:", t.count('<table'), "next_f:", t.count('self.__next_f'), "NEXT_DATA:", t.count('__NEXT_DATA__'))
          for k in ['12 tháng','Áp dụng','hiệu lực','Online','cuối kỳ','.pdf','/api/']:
              idx=[m.start() for m in re.finditer(re.escape(k), t)][:3]
              for i in idx: print("LPB", repr(k), '|', re.sub(r'\s+',' ',t[max(0,i-150):i+250]).replace('\\"','"')[:400])
          PY
