name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch LPBank
        run: |
          H='Content-Type: application/json'
          for cat in TK_TTQ_KHCN TK_ONLINE; do
            curl -sS -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130" -H "$H" -H "Referer: https://lpbank.com.vn/ca-nhan/lai-suat" -H "Origin: https://lpbank.com.vn" \
              -d "{\"category\":\"$cat\"}" https://lpbank.com.vn/api/content-service/public/interest-rate/findAll -o $cat.json
            echo "LPBSIZE $cat $(wc -c < $cat.json)"
          done
          python3 -c "import json; print('LPBFIX', json.dumps({c: json.load(open(c+'.json')) for c in ('TK_TTQ_KHCN','TK_ONLINE')}, ensure_ascii=True))"
