name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -m 25 -L -A "$UA" https://lpbank.com.vn/ -o lpb.html
          python3 - <<'PY'
          import re
          t=open('lpb.html',encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'href="([^"]*(?:lai-suat|lai_suat|laisuat|interest|bieu)[^"]*)"', t, re.I)))
          print("LPB links:", links[:40])
          print("LPB api-ish:", sorted(set(re.findall(r'https?://[^"\' ]*(?:api|json)[^"\' ]*', t)))[:20])
          PY
          for u in https://lpbank.com.vn/lai-suat-tiet-kiem https://lpbank.com.vn/ca-nhan/lai-suat https://lpbank.com.vn/khach-hang-ca-nhan/lai-suat-tien-gui; do
            printf "%s " $u; curl -sS -m 25 -L -A "$UA" "$u" -o x.html -w "%{http_code} %{size_download}\n"; done
          curl -sS -m 40 -A "$UA" "https://media.eximbank.com.vn/exim/files/TB%20LSHD%20VND%20KHBL%20hieu%20luc%20tu%20ngay%2031102026.pdf" -o eib.pdf -w "eximbank pdf %{http_code} %{size_download}\n" || echo "eximbank curl failed"
          python3 -c "
          import ssl,urllib.request
          try:
              urllib.request.urlopen('https://media.eximbank.com.vn/exim/files/KHCN-LaisuathuydongUSD.pdf',timeout=30); print('python urllib ok')
          except Exception as e: print('python urllib', type(e).__name__, str(e)[:120])"
