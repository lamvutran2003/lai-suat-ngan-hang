name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -sS -m 25 -A "$UA" https://lpbank.com.vn/ca-nhan/lai-suat -o p.html
          grep -oE '(src|href)="[^"]+\.js"' p.html | head -20 | sed 's/^/LPBSRC /'
          for js in $(grep -oE '(src|href)="[^"]+\.js"' p.html | sed -E 's/(src|href)="//;s/"$//'); do case "$js" in http*) u="$js";; /*) u="https://lpbank.com.vn$js";; *) u="https://lpbank.com.vn/$js";; esac; curl -sS -m 25 -A "$UA" "$u" >> all.js; done
          echo "LPBJS size $(wc -c < all.js)"
          grep -oE '.{120}TK_ONLINE.{300}' all.js | head -3 | sed 's/^/LPBCTX /'
          grep -oE '"[A-Z]{2,4}_[A-Z0-9_]{2,40}"' all.js | grep -E 'TK|TG|KKH|CKH|ONLINE' | sort -u | head -80 | tr '\n' ' ' | sed 's/^/LPBCODES /'; echo
          grep -oE "'[A-Z]{2,4}_[A-Z0-9_]{2,40}'" all.js | grep -E 'TK|TG|KKH|CKH|ONLINE' | sort -u | head -80 | tr '\n' ' ' | sed 's/^/LPBCODES2 /'; echo
