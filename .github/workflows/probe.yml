name: Probe gold sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          echo "=== doji api"; curl -sS -m 25 -A "$UA" -L "https://banggia.doji.vn/api/giavang/?api_key=258fbd2a72ce8481089d88c678e9fe4f" | head -c 2500; echo
          echo "=== doji page"; curl -sS -m 25 -A "$UA" https://banggia.doji.vn/ -o page.html; grep -oE 'src="[^"]+\.js"' page.html
          for js in $(grep -oE 'src="[^"]+\.js"' page.html | sed 's/src="//;s/"$//'); do
            echo "--- $js"; curl -sS -m 25 -A "$UA" "https://banggia.doji.vn/$js" | grep -oE '"(https?:)?//[^"]*(api|gia|price)[^"]*"|/api/[A-Za-z0-9/_?=.-]+' | sort -u | head -20
          done
