name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130"
          curl -sS -m 25 -A "$UA" https://lpbank.com.vn/ca-nhan/lai-suat -o p.html
          grep -oiE '<link[^>]+(icon)[^>]*>' p.html | sed 's/^/LPBICON /'
          for u in $(grep -oiE '<link[^>]+icon[^>]*>' p.html | grep -oE 'href="[^"]+"' | sed 's/href="//;s/"$//'); do
            case "$u" in http*) f="$u";; /*) f="https://lpbank.com.vn$u";; *) f="https://lpbank.com.vn/$u";; esac
            curl -sS -m 25 -A "$UA" "$f" -o ic.bin && echo "LPBIMG $f $(wc -c < ic.bin) $(base64 -w0 ic.bin)"
          done
