name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 - <<'PY'
          import asyncio, re
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36", locale="vi-VN")
                  calls = []
                  async def on_resp(r):
                      if r.request.resource_type in ("xhr", "fetch"):
                          try: body = (await r.text())[:400]
                          except Exception: body = ""
                          calls.append((r.request.method, r.url, r.status, r.request.post_data, body))
                  pg.on("response", on_resp)
                  await pg.goto("https://lpbank.com.vn/ca-nhan/lai-suat", wait_until="networkidle", timeout=60000)
                  await pg.wait_for_timeout(3000)
                  for m,u,s,pd,body in calls:
                      if any(k in u for k in ("google","facebook","analytics","doubleclick","tiktok")): continue
                      print("LPBCALL", m, s, u[:200], "| post:", (pd or "")[:200]); print("LPBBODY", re.sub(r"\s+"," ",body)[:400])
                  t = await pg.evaluate("document.body.innerText")
                  i = t.find("Kỳ hạn"); print("LPBTEXT", re.sub(r"\s+"," | ",t[i:i+1500]))
                  await b.close()
          asyncio.run(main())
          PY
