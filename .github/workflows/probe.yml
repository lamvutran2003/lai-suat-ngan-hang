name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36"
          curl -sS -m 25 -A "$UA" https://lpbank.com.vn/ca-nhan/lai-suat -o p.html
          for js in $(grep -oE 'src="[^"]+\.js"' p.html | sed 's/src="//;s/"$//'); do curl -sS -m 25 -A "$UA" "https://lpbank.com.vn/$js" >> all.js; done
          echo "LPBJS size $(wc -c < all.js)"; grep -oE '"(BD_)?(TK|TG|CCTG|LS)_[A-Z0-9_]{2,40}"' all.js | sort | uniq -c | sort -rn | head -60 | sed 's/^/LPBJS /'
          python3 - <<'PY'
          import json, urllib.request
          H={"User-Agent":"Mozilla/5.0","Content-Type":"application/json","Referer":"https://lpbank.com.vn/ca-nhan/lai-suat","Origin":"https://lpbank.com.vn"}
          r=urllib.request.Request("https://lpbank.com.vn/api/content-service/public/interest-rate/findAll", data=b'{"category":"TK_ONLINE"}', headers=H)
          for x in json.load(urllib.request.urlopen(r, timeout=30))["data"]:
              print("LPBROW", x["recordType"], x["channel"], x["groupInterest"], x["term"], x["startValue"], x["monthValue"], x["quarterValue"], x["endValue"], x["receivedEndTerm"], x["receivedFirst"], x["withdrawOneTime"], x["lsVnd"], x["effectiveDate"][:10], (x["description"] or "")[:80].replace("\n"," "))
          PY
