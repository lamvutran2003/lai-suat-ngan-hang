name: Probe bank sources (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36","Content-Type":"application/json","Referer":"https://lpbank.com.vn/ca-nhan/lai-suat","Origin":"https://lpbank.com.vn"}
          def post(path, body):
              r=urllib.request.Request("https://lpbank.com.vn/api/content-service/public/"+path, data=json.dumps(body).encode(), headers=H)
              return json.load(urllib.request.urlopen(r, timeout=30))
          for code in (["KHCN_INTEREST_RATE"], ["INTEREST_RATE"], ["KHDN_INTEREST_RATE"]):
              try:
                  d=post("common/findAllCommonCategory", {"code": code}); print("LPBCAT", code, json.dumps(d, ensure_ascii=False)[:1500])
              except Exception as e: print("LPBCAT", code, "ERR", e)
          for cat in ["TK_CKH_VND","TK_CKH_LLCK","TK_TT_TK_CKH","TK_ONLINE","TK_CKH","TG_CKH_VND","TK_CKH_LLCK_VND"]:
              try:
                  d=post("interest-rate/findAll", {"category": cat}); rows=d.get("data") or []
                  print("LPBDATA", cat, len(rows), json.dumps(rows[:3], ensure_ascii=False)[:900])
              except Exception as e: print("LPBDATA", cat, "ERR", e)
          PY
